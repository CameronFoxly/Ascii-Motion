name: MCP parity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The lock covers root/core only; initializing docs adds unlocked workspaces.
          # Premium is private; the app typechecks against src/lib/premium-stub.ts without it.
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated bridge artifacts are up to date
        run: npm run mcp:contract:check
      - name: Typecheck (coverage maps fail on unclassified tools/formats)
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Bridge semantic + coverage tests
        run: npm run test:mcp
